name: Mirror verified Session 5 deck v15
on:
  push:
    paths:
      - '.github/workflows/praxis-deck-v15-sync-20261029.yml'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce exact verified Drive bytes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,base64,zlib,json,hashlib,io
          folder=Path('01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 30, 2026')
          src=folder/'CURRENT - GWU Dr Hao - Session 5 - Oct 30, 2026 - v14 - Carlo Methodology.pptx'
          dst=folder/'CURRENT - GWU Dr Hao - Session 5 - Oct 30, 2026 - v15 - Carlo Methodology.pptx'
          assert not dst.exists(),'Destination already exists; inspect concurrent edits'
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='3ff4d711f775ec2107a0c789ea105c447e60c8f81f73177a4d02ba273d23d7a1','Source drift'
          encoded=''''''
          delta=json.loads(zlib.decompress(base64.b64decode(encoded)))
          with zipfile.ZipFile(src) as z: data={n:z.read(n) for n in z.namelist()}
          for n,ops in delta.items():
              original=data.get(n,b'')
              data[n]=b''.join(original[o[0]:o[0]+o[1]] if isinstance(o,list) else base64.b64decode(o) for o in ops)
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w') as z:
              for n in sorted(data):
                  info=zipfile.ZipInfo(n,(2026,10,29,0,0,0));info.compress_type=zipfile.ZIP_STORED;info.create_system=3;info.external_attr=0o600<<16
                  z.writestr(info,data[n])
          result=buf.getvalue()
          assert len(result)==4012068
          assert hashlib.sha256(result).hexdigest()=='4438bdb60dea4c9bc168fc4d69e0e43a2178399d057767848b82bc938b470b73','Not exact Drive bytes'
          assert hashlib.sha1(b'blob '+str(len(result)).encode()+b'\0'+result).hexdigest()=='88ce373bce8390c9a04678d1b3aed6415754e3b0'
          dst.write_bytes(result);src.unlink()
          p=Path('00 — README & Governance/MIRROR_STATUS.md')
          entry='''## Session 5 deck v15 — October 29, 2026

          - Google Drive ASOT: https://docs.google.com/presentation/d/1MAbj3A1BSy-iGH1F4wir3OqeObsqdq0W/edit . Updated and renamed the current v14 deck in place; link and sharing retained.
          - Current mirror: `01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 30, 2026/CURRENT - GWU Dr Hao - Session 5 - Oct 30, 2026 - v15 - Carlo Methodology.pptx`. The former current v14 path is superseded; Git history retains it.
          - Chapter 2 narrative: **32 to 51 pages (+19)**. Current manuscript v11: 76 total = 10 front matter + 51 narrative + 15 References. Four pages of the change from the earlier 47-page rendering are double-spacing reflow, not newly authored text.
          - Bold emphasis: three civilian use cases (school wildfire situational awareness; flood information for hospital access; municipal reservoir and bloom monitoring), 20 expansion-support sources, 91 unique references. The 20-source package contains 15 new unique bibliography entries plus five already in v9.
          - Updated cover/progress/feedback/use-case text, native growth chart and embedded chart workbook, speaker notes and page references. All 29 slides retained. Carlo methodology slide, GWU cover design, hypotheses, media, and Oct 30/Nov 14 Gantt markers preserved. Manuscript and model unchanged; no new run or advisor submission.
          - Exact Drive readback verified: 4,012,068 bytes; SHA-256 `4438bdb60dea4c9bc168fc4d69e0e43a2178399d057767848b82bc938b470b73`; Git blob `88ce373bce8390c9a04678d1b3aed6415754e3b0`.

          ---

          '''
          p.write_text(entry+p.read_text(encoding='utf-8'),encoding='utf-8')
          print('PASS: exact Drive v15 bytes; full deck retained')
          PY
      - name: Commit verified mirror and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'Praxis Mirror Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/praxis-deck-v15-sync-20261029.yml'
          git add -A -- '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 30, 2026' '00 — README & Governance/MIRROR_STATUS.md'
          git commit -m 'Mirror Drive v15: 51 narrative pages, +19 from v9, three civilian cases and 91 references'
          git push origin HEAD:main
