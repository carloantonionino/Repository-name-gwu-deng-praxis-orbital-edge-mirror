name: Replace v10 with verified Drive v11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/praxis-v11-highlight-sync-20261029.yml']
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce and verify exact Drive-authoritative v11 bytes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          import hashlib, re, html
          folder=Path('01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 31, 2026')
          src=folder/'v10 - Oct 28 cn.docx'
          dst=folder/'v11 - Oct 28 cn.docx'
          assert not dst.exists(), 'Existing v11 requires reconciliation'
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='82b7018c82884de50f3840448964199dee481bcf98dce366171a3f64cad37a53', 'v10 drift'
          START='Use Case 1: School Wildfire Situational Awareness'
          LAST='A Bounded Interpretation of Human and System Performance'
          STOP='2.4 Degraded Communications, Environmental Conditions, and Resilience'
          OLD_LEGEND='v10 | 28 Oct 2026 | Tan: additions and citation updates since Meeting 4 (v8)'
          NEW_LEGEND='v11 | 28 Oct 2026 | Tan: §2.3 review focus (pp. 21–33) and 20 references'
          KEYS=[
          '10.1145/3290605.3300233','10.1016/0005-1098(83)90046-8',
          'mywaterquality.ca.gov/habs/resources/satellite-map.html',
          '10.1145/3582016.3582043','10.1518/001872095779064555',
          '4a8423d5e91fda00bb7e46540e2b0cf1-Abstract.html','10.3390/rs12142205',
          'proceedings.mlr.press/v70/guo17a.html','10.1518/hfes.46.1.50_30392',
          '10.1518/001872097778543886','10.1109/3468.844354','10.1186/s12942-022-00315-2',
          '10.3390/rs14133180','10.3390/rs13081518','10.1057/jos.2012.20',
          '10.1016/j.envsoft.2018.08.015','10.1016/j.rse.2013.12.008',
          '10.1080/01431161.2016.1192304',
          'epa.gov/water-research/cyanobacteria-assessment-network-application-cyan-app',
          'stacks.cdc.gov/view/cdc/108685/cdc_108685_DS1.pdf']
          SHD='<w:shd w:val="clear" w:color="auto" w:fill="F2E4CF"/>'
          def text(p):
           return ''.join(html.unescape(s) for s in re.findall(r'<w:t(?:\s[^>]*)?>([^<]*)</w:t>',p,re.S))
          def shade_run(m):
           r=m.group(0)
           if not re.search(r'<w:t(?:\s|>)',r):return r
           if '</w:rPr>' in r:return r.replace('</w:rPr>',SHD+'</w:rPr>',1)
           if '<w:rPr/>' in r:return r.replace('<w:rPr/>','<w:rPr>'+SHD+'</w:rPr>',1)
           return re.sub(r'^(<w:r\b[^>]*>)',lambda m:m[1]+'<w:rPr>'+SHD+'</w:rPr>',r,count=1)
          with ZipFile(src) as zin:
           contents={i.filename:zin.read(i.filename) for i in zin.infolist()}
           original=contents['word/document.xml'].decode('utf-8')
           xml=re.sub(r'<w:highlight\b[^>]*/>','',original)
           xml=re.sub(r'<w:shd\b[^>]*/>',lambda m:'' if 'F2E4CF' in m[0] else m[0],xml)
           state={'active':False,'started':0,'last':0,'stopped':0,'refs':False,'body_count':0,'keys':[]}
           def paragraph(m):
            p=m[0];t=text(p).strip()
            if t==START:state['active']=True;state['started']+=1
            if t==LAST:state['last']+=1
            if state['active'] and t==STOP:state['active']=False;state['stopped']+=1
            if t=='References':state['refs']=True
            ks=[k for k in KEYS if k in t] if state['refs'] else []
            assert len(ks)<=1
            if state['active'] or ks:
             if state['active']:state['body_count']+=1
             state['keys']+=ks
             p=re.sub(r'<w:r\b[^>]*>.*?</w:r>',shade_run,p,flags=re.S)
            return p
           xml=re.sub(r'<w:p\b[^>]*>.*?</w:p>',paragraph,xml,flags=re.S)
           assert state['started']==state['last']==state['stopped']==1,state
           assert state['body_count']==53
           assert len(state['keys'])==20 and set(state['keys'])==set(KEYS),state
           assert OLD_LEGEND in xml
           xml=xml.replace(OLD_LEGEND,NEW_LEGEND,1)
           assert text(xml).replace(NEW_LEGEND,OLD_LEGEND)==text(original),'Unexpected manuscript-text change'
           contents['word/document.xml']=xml.encode('utf-8')
           core=contents['docProps/core.xml'].decode('utf-8')
           core=core.replace('<dc:title>v10 - Oct 28 cn</dc:title>','<dc:title>v11 - Oct 28 cn</dc:title>')
           core=re.sub(r'<cp:revision>\d+</cp:revision>','<cp:revision>11</cp:revision>',core)
           contents['docProps/core.xml']=core.encode('utf-8')
           with ZipFile(dst,'w',compression=ZIP_STORED) as zout:
            for name,b in contents.items():
             info=ZipInfo(name,(2026,10,28,0,0,0));info.compress_type=ZIP_STORED
             info.create_system=3;info.external_attr=0o600<<16
             zout.writestr(info,b)
          b=dst.read_bytes()
          assert len(b)==743033
          assert hashlib.sha256(b).hexdigest()=='afb46794aaadd4564cec70ba48b8533b039841603d74551cd5d2ac53c25f49de','Drive SHA-256 mismatch'
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='1d7832ab2df1a0576a7a7ed7da09e69cb2f853f2','Git blob mismatch'
          src.unlink()
          manifest=Path('00 — README & Governance/MIRROR_STATUS.md')
          entry='## v11 focused-highlighting replacement — October 29, 2026\n\n'
          entry+='- Google Drive ASOT: [v11 - Oct 28 cn.docx](https://docs.google.com/document/d/12ZWPsFc2J9PaHwML62_epcqR9W4eAnLz/edit). Replaced v10 in place with the same file ID and permissions.\n'
          entry+='- Current mirror: `'+str(dst)+'`. The v10 path is removed from the current tree; prior commits retain its history.\n'
          entry+='- Tan shading is confined to the School Wildfire use-case heading through the closing paragraph of A Bounded Interpretation of Human and System Performance (printed pp. 21–33), plus exactly 20 individually selected expansion references. Other revision highlighting cleared.\n'
          entry+='- Manuscript prose, reference text, comments, tables and pagination preserved; only review highlighting, cover legend and version metadata changed. 71 pages total / 47 Chapter 2 narrative pages. Slide deck unchanged in this scope.\n'
          entry+='- Drive readback verified before mirroring: 743,033 bytes; SHA-256 `afb46794aaadd4564cec70ba48b8533b039841603d74551cd5d2ac53c25f49de`; Git blob `1d7832ab2df1a0576a7a7ed7da09e69cb2f853f2`.\n\n---\n\n'
          manifest.write_text(entry+manifest.read_text(encoding='utf-8'),encoding='utf-8')
          Path('.github/workflows/praxis-v11-highlight-sync-20261029.yml').unlink()
          print('PASS: Drive-exact v11, 53 body paragraphs, 20 reference entries; v10 current path removed.')
          PY
      - name: Commit verified replacement and remove one-time transfer
        shell: bash
        run: |
          git config user.name 'Praxis Mirror Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 31, 2026/v10 - Oct 28 cn.docx' '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 31, 2026/v11 - Oct 28 cn.docx' '00 — README & Governance/MIRROR_STATUS.md' '.github/workflows/praxis-v11-highlight-sync-20261029.yml'
          git commit -m 'Replace v10 with Drive-authoritative v11: focused section 2.3 highlighting and 20 references'
          git push origin HEAD:main
