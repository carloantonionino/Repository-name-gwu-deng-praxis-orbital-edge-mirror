name: Verify and complete Session 5 mirror
on:
  push:
    paths:
      - '.github/workflows/session5-finish-mirror-20261029.yml'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Ensure lossless transfer utility
        run: command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y zstd)
      - name: Reconstruct and verify exact Drive files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, struct, subprocess, tempfile, zlib
          from pathlib import Path
          from zipfile import ZipFile
          def sha(b): return hashlib.sha256(b).hexdigest()
          def pack(blob):
              out=bytearray(b'ZP01'); cursor=0
              with ZipFile(io.BytesIO(blob)) as z:
                  for i in sorted(z.infolist(), key=lambda i:i.header_offset):
                      nl,el=struct.unpack_from('<HH',blob,i.header_offset+26)
                      start=i.header_offset+30+nl+el
                      raw=z.read(i.filename)
                      head=blob[cursor:start]
                      out+=struct.pack('<IIb',len(head),len(raw),6)+head+raw
                      cursor=start+i.compress_size
              tail=blob[cursor:]
              return bytes(out+struct.pack('<IIb',len(tail),0,-2)+tail)
          def unpack(b):
              assert b[:4]==b'ZP01'
              out=bytearray(); p=4
              while p<len(b):
                  hn,bn,lev=struct.unpack_from('<IIb',b,p); p+=9
                  out+=b[p:p+hn]; p+=hn
                  raw=b[p:p+bn]; p+=bn
                  if lev>=0:
                      c=zlib.compressobj(lev,zlib.DEFLATED,-15)
                      out+=c.compress(raw)+c.flush()
                  elif lev==-1: out+=raw
                  elif lev==-2: break
                  else: raise ValueError('Invalid transfer record')
              return bytes(out)
          prefix='01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/'
          target_folder=prefix+'Mtg 5 - Oct 31, 2026/'
          specs=[
              {'label':'doc','source':prefix+'Mtg 5 - Oct 31, 2026/vx - Oct 28 cn.docx','destination':target_folder+'v10 - Oct 28 cn.docx','source_sha256':'6fba333a177c3ac7be2c20c32077dae5af66df7860eb1586da9419f092adb3b3','packed_sha256':'30c224e720b7cd9cab3e06b04e80d5f759895a0957ad7c5f85f5322ee67e80bb','patch_sha256':'dae29e70b5955c88cb3b52194ac6113111f2a6fa26c7fed1aec268facf3f53fe','sha256':'82b7018c82884de50f3840448964199dee481bcf98dce366171a3f64cad37a53','size':94932,'git_blob':'657e1f7d4a8d298be5ce09493f5dc767993811b1','drive_id':'12ZWPsFc2J9PaHwML62_epcqR9W4eAnLz','payloads':['.github/session5-doc-transfer.b85']},
              {'label':'deck','source':prefix+'Mtg 3 - Oct 03, 2026/Nino GWU Advisor Update - 03 Oct 2026 - Draft v08.pptx','destination':target_folder+'GWU Dr Hao - Session 5 - Oct 30, 2026 - Updated Oct 28.pptx','source_sha256':'bea813fa488a358dc7fd5d9c38b4b89e3ded82b7fc3fe4154d7cf8e552512500','packed_sha256':'c581ac2756b9021b196db1380fd8b38d3f6243f20dd7b168627c8a082f21e81a','patch_sha256':'e15d5b3acd5fa9c4e154c7d8da3348322ee5d82aade7cbe4db99b880dbd42f46','sha256':'fcdda09f65f30302ad349f27cbedcbf94d47ee350752c61abc28d8674e819551','size':2326078,'git_blob':'9ad7b0a11d513c27c71ba12a56dde612b2d1ec9e','drive_id':'1ESMxpTGZSDvq3GjKXveDFanzIhJfO7FF','payloads':['.github/session5-deck-transfer-1.b85','.github/session5-deck-transfer-2.b85','.github/session5-deck-transfer-3.b85']}
          ]
          verified=[]
          with tempfile.TemporaryDirectory() as tmp:
              tmp=Path(tmp)
              for s in specs:
                  source=Path(s['source']).read_bytes()
                  assert sha(source)==s['source_sha256'], 'Source drift: '+s['label']
                  packed=pack(source)
                  assert sha(packed)==s['packed_sha256'], 'Packed source mismatch: '+s['label']
                  payload=''.join(Path(p).read_text().strip() for p in s['payloads'])
                  patch=base64.b85decode(payload)
                  assert sha(patch)==s['patch_sha256'], 'Transfer checksum mismatch: '+s['label']
                  (tmp/'base').write_bytes(packed); (tmp/'patch').write_bytes(patch)
                  subprocess.run(['zstd','-d','-q','-f','--patch-from='+str(tmp/'base'),str(tmp/'patch'),'-o',str(tmp/'target')],check=True)
                  result=unpack((tmp/'target').read_bytes())
                  assert len(result)==s['size'] and sha(result)==s['sha256'], 'Target differs from Drive: '+s['label']
                  blob=hashlib.sha1(b'blob '+str(len(result)).encode()+b'\0'+result).hexdigest()
                  assert blob==s['git_blob']
                  dest=Path(s['destination'])
                  assert not dest.exists() or dest.read_bytes()==result, 'Existing destination differs; review required'
                  verified.append((s,result))
              for s,result in verified:
                  dest=Path(s['destination']); dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(result)
                  print('PASS',s['destination'],s['size'],s['sha256'])
          manifest={'sync_date':'2026-10-29','artifact_date':'2026-10-28','session_5_briefing':'2026-10-30','session_6':'2026-11-14','authority':'Google Drive','scope':'Two completed Drive-authoritative Office artifacts; prior versions preserved','narrative_pages':{'v8_meeting_4':17,'v9':32,'v10':47,'increase_since_meeting_4':30,'increase_since_v9':15,'excludes':'Front matter and bibliography'},'deck_slides':29,'matlab_evidence':'Recorded bounded regression: 100 observations per architecture, 200 entity-level latency comparisons, not 200 replications; owner reproduction remains pending','files':[{k:s[k] for k in ('destination','drive_id','size','sha256','git_blob')} for s in specs]}
          governance=Path('00 — README & Governance')
          (governance/'Session 5 Sync - 29 Oct 2026.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          status=governance/'MIRROR_STATUS.md'
          entry='## Session 5 package synchronization — October 29, 2026\n\nGoogle Drive remains ASOT. Mirrored the verified October 28 v10 manuscript and full 29-slide GWU advisor deck for the October 30 briefing. The historical Meeting 5 folder name is retained.\n\n- Manuscript: `v10 - Oct 28 cn.docx`; Drive ID `12ZWPsFc2J9PaHwML62_epcqR9W4eAnLz`; 94,932 bytes; SHA-256 `82b7018c82884de50f3840448964199dee481bcf98dce366171a3f64cad37a53`. Tan marks additions and citation updates since Meeting 4 (v8).\n- Deck: `GWU Dr Hao - Session 5 - Oct 30, 2026 - Updated Oct 28.pptx`; Drive ID `1ESMxpTGZSDvq3GjKXveDFanzIhJfO7FF`; 2,326,078 bytes; SHA-256 `fcdda09f65f30302ad349f27cbedcbf94d47ee350752c61abc28d8674e819551`. Full GWU cover, colored hypothesis illustration, advisor responses and updated schedules retained.\n- Chapter 2 narrative: 17 pages (v8), 32 (v9), 47 (v10). Growth is +30 since Meeting 4 and +15 beyond v9, excluding front matter and bibliography.\n- Gantt markers: green October 30; red November 14, 2026, Session 6.\n- MATLAB evidence: 200 entity-level comparisons, 100 per architecture, within one bounded regression. Additional owner reproduction and scaled replications remain separate gates.\n- Next priority: modify, reduce and edit Chapter 2 following advisor guidance. Advisor acceptance and submission are not claimed.\n- Exact hashes verified before committing. Prior manuscripts, model and data files remain unchanged. Temporary transfer machinery removed after successful verification. Detailed scope: `Session 5 Sync - 29 Oct 2026.json`.\n\n---\n\n'
          status.write_text(entry+status.read_text())
          PY
      - name: Commit verified mirror and remove temporary transport
        shell: bash
        run: |
          git config user.name 'Praxis Mirror Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 31, 2026/v10 - Oct 28 cn.docx' '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 31, 2026/GWU Dr Hao - Session 5 - Oct 30, 2026 - Updated Oct 28.pptx' '00 — README & Governance/Session 5 Sync - 29 Oct 2026.json' '00 — README & Governance/MIRROR_STATUS.md'
          git rm -- .github/session5-doc-transfer.b85 .github/session5-deck-transfer-1.b85 .github/session5-deck-transfer-2.b85 .github/session5-deck-transfer-3.b85 .github/workflows/session5-binary-transfer-20261029.yml .github/workflows/session5-finish-mirror-20261029.yml
          git commit -m 'Mirror verified Drive Session 5 v10 manuscript and full GWU deck' -m 'Exact Drive SHA-256 and Git blob checks passed. Preserve prior versions; record narrative-page growth and 200 entity-comparison regression scope. Remove one-time transfer machinery.'
          git push origin HEAD:main
