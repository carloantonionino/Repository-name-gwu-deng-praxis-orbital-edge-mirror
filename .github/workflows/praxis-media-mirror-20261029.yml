name: Complete verified Praxis media mirror
on:
  push:
    paths:
      - '.github/workflows/praxis-media-mirror-20261029.yml'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify files, mirror media, and remove temporary transfer files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          spec=[{'name': 'H0 _ H1.gif', 'size': 15357082, 'sha256': 'b8be24e4695822c8075b00aa5c595dab8c5bd26b16016a4672cb985c61effbdf', 'git_blob': '5a9bd5e98367169a5a1079d18acfec21d457e74a', 'index': 0, 'drive': [{'location': 'Media', 'id': '1RYQCTyPvWFuImFNsfgDGz96S3mCTA43c', 'url': 'https://drive.google.com/file/d/1RYQCTyPvWFuImFNsfgDGz96S3mCTA43c/view?usp=drivesdk'}, {'location': 'Session 5', 'id': '1WkqU-A2lsO3YUoeIOD7CG7ZrB7SABNTL', 'url': 'https://drive.google.com/file/d/1WkqU-A2lsO3YUoeIOD7CG7ZrB7SABNTL/view?usp=drivesdk'}], 'destinations': ['07 — Figures, OV-1 & Visuals/01 — Screenshots & Multimedia/H0 _ H1.gif', '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 30, 2026/H0 _ H1.gif'], 'parts': ['.github/praxis-media-transfer-20261029/part-0-0', '.github/praxis-media-transfer-20261029/part-0-1']}, {'name': 'H0 _ H1 Low Res.gif', 'size': 1953254, 'sha256': 'ddd4f4452b1b94c10ef3f6b63ad499d02d28f9812f90e7ea4f99b8cfe38bcdc1', 'git_blob': 'c6290076052a0d67b552e5b2185966720e7fe0a7', 'index': 1, 'drive': [{'location': 'Media', 'id': '1lGkyLCsatel-Sy6pULIFkhO5uznnRbIU', 'url': 'https://drive.google.com/file/d/1lGkyLCsatel-Sy6pULIFkhO5uznnRbIU/view?usp=drivesdk'}, {'location': 'Session 5', 'id': '1OvzlJ9cbfadUJUPNoPerLFnqFBJawX3N', 'url': 'https://drive.google.com/file/d/1OvzlJ9cbfadUJUPNoPerLFnqFBJawX3N/view?usp=drivesdk'}], 'destinations': ['07 — Figures, OV-1 & Visuals/01 — Screenshots & Multimedia/H0 _ H1 Low Res.gif', '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 30, 2026/H0 _ H1 Low Res.gif'], 'parts': []}, {'name': 'Satelite Ho H1 folder.zip', 'size': 24106512, 'sha256': '75ec7e8574b630fe57b1bd86b66789f8eaf0f7cfe9afeae82ec75b7edeff34b4', 'git_blob': 'ee06f5ad3f1884a4988e772e70f1f8ad34cbe1e3', 'index': 2, 'drive': [{'location': 'Media', 'id': '1koPC1yu7acPYZujmkpXqmljy1bS_FD4E', 'url': 'https://drive.google.com/file/d/1koPC1yu7acPYZujmkpXqmljy1bS_FD4E/view?usp=drivesdk'}, {'location': 'Session 5', 'id': '1vEJFg20k3ZJdaICM_DLbvKEx92DQ-rf1', 'url': 'https://drive.google.com/file/d/1vEJFg20k3ZJdaICM_DLbvKEx92DQ-rf1/view?usp=drivesdk'}], 'destinations': ['07 — Figures, OV-1 & Visuals/01 — Screenshots & Multimedia/Satelite Ho H1 folder.zip', '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 30, 2026/Satelite Ho H1 folder.zip'], 'parts': ['.github/praxis-media-transfer-20261029/part-2-0', '.github/praxis-media-transfer-20261029/part-2-1', '.github/praxis-media-transfer-20261029/part-2-2', '.github/praxis-media-transfer-20261029/part-2-3']}]
          verified=[]
          for f in spec:
              data=(b''.join(Path(p).read_bytes() for p in f['parts']) if f['parts'] else Path(f['destinations'][0]).read_bytes())
              assert len(data)==f['size'], 'Size mismatch: '+f['name']
              assert hashlib.sha256(data).hexdigest()==f['sha256'], 'SHA-256 mismatch: '+f['name']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==f['git_blob']
              for destination in f['destinations']:
                  p=Path(destination)
                  assert not p.exists() or p.read_bytes()==data, 'Existing file differs: '+destination
              verified.append((f,data))
          for f,data in verified:
              for destination in f['destinations']:
                  p=Path(destination);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
                  print('VERIFIED',destination,len(data),f['sha256'])
          record={'sync_date':'2026-10-29','session_5_date':'2026-10-30','authority':'Google Drive','scope':'Original animated hypothesis GIFs and editable project ZIP mirrored into Media and Session 5; meeting folder renamed October 30; prior content preserved','files':spec}
          Path('00 — README & Governance/H0-H1 Media Sync - 29 Oct 2026.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'Praxis Mirror Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '07 — Figures, OV-1 & Visuals/01 — Screenshots & Multimedia' '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 30, 2026' '00 — README & Governance/H0-H1 Media Sync - 29 Oct 2026.json'
          git rm -r -- '.github/praxis-media-transfer-20261029' '.github/workflows/praxis-media-mirror-20261029.yml'
          git commit -m 'Mirror H0-H1 animations and project for October 30 Session 5'
          git push origin HEAD:main
