name: Session 5 controlled binary transfer
on:
  push:
    paths:
      - '.github/workflows/session5-binary-transfer-20261029.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: session5-mirror-source
          retention-days: 1
          path: |
            01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 3 - Oct 03, 2026/Nino GWU Advisor Update - 03 Oct 2026 - Draft v08.pptx
            01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 31, 2026/vx - Oct 28 cn.docx
