name: Mirror Drive registers 2026-10-26
on:
  push:
    branches: [main]
    paths: ['00 — README & Governance/register-transfer-20261026.b64']
permissions:
  contents: write
concurrency:
  group: register-mirror-20261026
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconstruct exact approved files and commit scoped mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, base64, lzma, hashlib, re, io, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['GITHUB_SHA']
          api_root = 'https://api.github.com/repos/' + repo
          transfer_path = '00 — README & Governance/register-transfer-20261026.b64'
          workflow_path = '.github/workflows/mirror-registers-20261026.yml'
          def api(path, data=None, method=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api_root + path, data=body, method=method or ('POST' if data is not None else 'GET'), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'gwu-register-mirror'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)
          def read_file(path):
              item=api('/contents/'+urllib.parse.quote(path, safe='/')+'?ref='+head)
              return base64.b64decode(item['content']), item['sha']
          def blob(data):
              return api('/git/blobs', {'content':base64.b64encode(data).decode(), 'encoding':'base64'})['sha']
          packed,_=read_file(transfer_path)
          payload=json.loads(lzma.decompress(base64.b64decode(packed)))
          assert payload['format']=='zip-diff-transfer-v1'
          assert payload['date']=='2026-10-26'
          assert api('/git/ref/heads/main')['object']['sha']==head, 'Main changed; aborting without a branch update.'
          parent=api('/git/commits/'+head)
          entries=[]
          manifest={'date':'2026-10-26','authority':'Google Drive','scope':'Three citation registers; five live placements; three predecessor backups. No manuscript, model, raw data, or other register versions changed.','references':20,'new_records':16,'existing_ids':['L011','L012','L018','L044'],'in_text_occurrences':32,'files':[]}
          drive_ids={'AIS':['1zsrpLKhRJMcKAPprz_AUQrLQpSNaR_3D','10r6d4PSGm_aelzB4TUN87zuS6tffEwCx'],'DATA':['1VOXVDT4NSq-zQqfFRQi7Xylu3qwkOlCt','1fSS4V55cZ83i-DbG-HgIdBPIacSH_tH4'],'ACE':['1YCkBJonhz08O0FFjT2g2CozdBZpkZXE3']}
          for spec in payload['workbooks']:
              source,source_sha=read_file(spec['source_paths'][0])
              assert hashlib.sha256(source).hexdigest()==spec['source_sha256'], 'Source mismatch'
              for path in spec['source_paths'][1:]:
                  other,_=read_file(path)
                  assert other==source, 'Duplicate source mismatch'
              parts=[]
              with zipfile.ZipFile(io.BytesIO(source)) as src:
                  for edit in spec['entries']:
                      name,mode=edit[:2]
                      if mode=='copy': data=src.read(name)
                      elif mode=='text': data=edit[2].encode()
                      elif mode=='patch':
                          tokens=re.findall(r'<[^>]*>|[^<]+',src.read(name).decode())
                          data=''.join(''.join(tokens[op[0]:op[1]]) if isinstance(op,list) else op for op in edit[2]).encode()
                      else: raise ValueError(mode)
                      parts.append((name,data))
              out=io.BytesIO()
              with zipfile.ZipFile(out,'w',compression=8,compresslevel=9) as z:
                  for name,data in parts:
                      zi=zipfile.ZipInfo(name,(2026,10,26,0,0,0))
                      zi.compress_type=8;zi.create_system=3;zi.external_attr=0o600<<16
                      z.writestr(zi,data,compress_type=8,compresslevel=9)
              result=out.getvalue()
              assert len(result)==spec['target_size']
              assert hashlib.sha256(result).hexdigest()==spec['target_sha256'], 'Target mismatch'
              target_sha=blob(result)
              entries.append({'path':spec['archive_path'],'mode':'100644','type':'blob','sha':source_sha})
              for path in spec['source_paths']:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              for path in spec['target_paths']:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':target_sha})
              manifest['files'].append({'register':spec['key'],'drive_file_ids':drive_ids[spec['key']],'paths':spec['target_paths'],'archive_path':spec['archive_path'],'sha256':spec['target_sha256'],'git_blob_sha':target_sha,'bytes':len(result)})
              print(spec['key'], 'PASS', spec['target_sha256'], target_sha, flush=True)
          status_path='00 — README & Governance/MIRROR_STATUS.md'
          status,_=read_file(status_path)
          text='# Citation-register reconciliation — 2026-10-26\n\nGoogle Drive is authoritative. Mirrored AIS v11 / CFG011, Research Data v20 / CFG020, and Chapter 2 ACE v02 / CFG002 from the approved Drive-controlled bytes. All 20 proposed section 2.3 references are mapped, with 32 in-text occurrences. ACE contains 13 new scholarly candidates and 3 new agency authorities; four existing source IDs are retained. Carlo reading/approval remains separate from manuscript citation. Existing scores, outreach history, raw-data readiness and manuscript prose are unchanged.\n\nBoth Active Registers and 00A placements are synchronized. Predecessors are preserved under 99 — Superseded Register Versions. SHA-256 and Git blob hashes are recorded in REGISTER_RECONCILIATION_2026-10-26.json. This is a scoped update, not a whole-repository certification.\n\n---\n\n'+status.decode()
          entries.append({'path':status_path,'mode':'100644','type':'blob','sha':blob(text.encode())})
          manifest_path='00 — README & Governance/REGISTER_RECONCILIATION_2026-10-26.json'
          entries.append({'path':manifest_path,'mode':'100644','type':'blob','sha':blob((json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode())})
          for path in [transfer_path,workflow_path]:
              entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
          assert api('/git/ref/heads/main')['object']['sha']==head, 'Concurrent change; abort'
          tree=api('/git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          commit=api('/git/commits',{'message':'Mirror Drive citation reconciliation: 20 references, preserved source history, verified identical workbook bytes','tree':tree['sha'],'parents':[head]})
          api('/git/refs/heads/main',{'sha':commit['sha'],'force':False},method='PATCH')
          print('COMMIT',commit['sha'],flush=True)
          PY
