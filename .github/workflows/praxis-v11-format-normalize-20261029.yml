name: Verify v11 formatting normalization
on:
  push:
    paths:
      - '.github/workflows/praxis-v11-format-normalize-20261029.yml'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Prepare exact controlled transformation
        run: |
          python -m pip install --quiet lxml==6.1.1 PyYAML
          git show '8cc459d19e1c7510654571241562662c01dc172b:.github/workflows/praxis-v11-format-normalize-20261029.yml' > /tmp/verified-transformation.yml
      - name: Reproduce exact verified Drive-authoritative bytes
        shell: bash
        run: |
          python - <<'PY'
          import yaml, subprocess
          from pathlib import Path
          source=yaml.safe_load(Path('/tmp/verified-transformation.yml').read_text())
          steps=source['jobs']['mirror']['steps']
          step=next(s for s in steps if s.get('name')=='Reproduce exact verified Drive-authoritative bytes')
          assert 'ecc3e0ec432d5def3f9dccaa44ea2c809f117b477418b8b428cd0b3f008b1e0a' in step['run']
          assert 'afb46794aaadd4564cec70ba48b8533b039841603d74551cd5d2ac53c25f49de' in step['run']
          subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
          PY
      - name: Commit verified mirror and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'Praxis Mirror Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01 — Advisor & Administrative/01 — Advisor Updates & Meeting Records/Mtg 5 - Oct 30, 2026/v11 - Oct 28 cn.docx' '00 — README & Governance/MIRROR_STATUS.md'
          git rm '.github/workflows/praxis-v11-format-normalize-20261029.yml'
          git commit -m 'Normalize v11 typography to GWU baseline and mirror exact Drive bytes' -m 'Formatting-only correction: double spacing, consistent indents, refreshed pagination; preserve prose, comments and focused highlights.'
          git push origin HEAD:main
